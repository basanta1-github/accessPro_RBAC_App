name: AccessPro CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: accesspro-production
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test_access_secret
          REFRESH_TOKEN_SECRET: test_refresh_secret
          INVITE_TOKEN_SECRET: test_invite_secret
          JWT_ACCESS_EXPIRES: 15m
          REFRESH_EXPIRES: 7d
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          WEBHOOK_SIGNING_SECRET: whsec_ci_placeholder
          SMTP_HOST: smtp.example.com
          SMTP_PORT: "587"
          SMTP_USER: ci@test.com
          SMTP_PASS: ci-test-pass
          HUNTER_API_KEY: ci-hunter-placeholder
        run: npm test

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    # Set repository variable ENABLE_SSH_DEPLOY=true after SSH secrets are configured
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_SSH_DEPLOY == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            APP_DIR="${{ secrets.APP_DIR }}"

            echo "Deploying AccessPro RBAC Backend..."
            echo "Target directory: $APP_DIR"

            if [ ! -d "$APP_DIR" ]; then
              echo "ERROR: APP_DIR does not exist on the server."
              echo "SSH in manually and run:"
              echo "  mkdir -p $APP_DIR"
              echo "  git clone https://github.com/${{ github.repository }}.git $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            if [ ! -d ".git" ]; then
              echo "ERROR: $APP_DIR is not a git repository."
              exit 1
            fi

            git fetch origin main
            git reset --hard origin/main

            npm ci --production

            pm2 restart accesspro \
              || pm2 start server.js --name accesspro --env production

            pm2 save

            echo "Deployment completed successfully."
